<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Color Picker</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="m15.3 4.7 4 4M13.5 6.5l4 4m-1-6.5 1.1-1.1a2.1 2.1 0 0 1 3 3l-1.1 1.1M5 19l-2 2 3.5-.6L18.4 8.5l-3-3L3.5 17.4 3 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <h1>Color Picker</h1>
          <p class="subtitle">화면 속 색상을 간편하게</p>
        </div>
      </header>

      <button class="pick-button" id="pick" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15.3 4.7 4 4M13.5 6.5l4 4m-1-6.5 1.1-1.1a2.1 2.1 0 0 1 3 3l-1.1 1.1M5 19l-2 2 3.5-.6L18.4 8.5l-3-3L3.5 17.4 3 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>색상 선택</span>
      </button>
      <p class="hint">화면을 확대해 원하는 픽셀을 선택하세요</p>

      <section class="history-section" aria-labelledby="history-heading">
        <div class="section-header">
          <div>
            <h2 id="history-heading">최근 색상</h2>
            <p class="section-hint">선택하면 다시 복사해요</p>
          </div>
          <button class="clear-button" id="clear" type="button">전체 삭제</button>
        </div>
        <p class="empty" id="empty">아직 선택한 색상이 없어요</p>
        <ul class="history" id="history" aria-label="최근 선택한 색상"></ul>
      </section>
      <p class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
  </body>
</html>
